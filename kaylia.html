<style>
.kaylia-page {
  background: #fff;
  color: #111;
}

.kaylia-hero {
  text-align: center;
  padding: 140px 20px 90px;
}

.kaylia-hero h1 {
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(64px, 9vw, 130px);
  font-weight: 400;
  margin: 0;
}

.kaylia-hero p {
  margin-top: 24px;
  font-size: 13px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
}

.kaylia-gallery {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 40px 140px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 72px 32px;
}

.kaylia-piece {
  text-align: center;
}

.kaylia-piece img {
  width: 100%;
  aspect-ratio: 3 / 4.8;
  object-fit: cover;
  display: block;
}

.kaylia-piece h3 {
  font-family: "Cormorant Garamond", serif;
  font-size: 25px;
  font-weight: 400;
  margin: 24px 0 8px;
}

.kaylia-piece span {
  font-size: 10px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
}

@media (max-width: 900px) {
  .kaylia-gallery {
    grid-template-columns: 1fr;
    padding: 0 24px 100px;
  }
}
  .piece-slider {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4.8;
  overflow: hidden;
  background: #f7f4ef;
}

.piece-slider img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.piece-slider img.active {
  display: block;
}

.slide-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  border: none;
  background: rgba(255,255,255,.75);
  font-size: 32px;
  width: 38px;
  height: 38px;
  cursor: pointer;
}

.slide-btn.prev {
  left: 12px;
}

.slide-btn.next {
  right: 12px;
}
</style>


<main class="kaylia-page">

  <section class="kaylia-hero">
    <h1>Kaylia</h1>
    <p>Shannen-Kaylia's creative output.</p>
  </section>

  <section class="kaylia-gallery">

    <div class="kaylia-piece">
      <img src="images/celeste.png" alt="Celeste">
      <h3>Celeste</h3>
      <span>Look 01</span>
    </div>

    <div class="kaylia-piece">
  <div class="piece-slider">
    <button class="slide-btn prev">‹</button>

    <img class="active" src="images/anna-dragonfly21.jpg" alt="Anna Dragonfly front">
<img src="images/anna-dragonfly21.jpg" alt="Anna Dragonfly detail">
<img src="images/anna-dragonfly22.jpg" alt="Anna Dragonfly close up">

    <button class="slide-btn next">›</button>
  </div>

  <h3>Fuchsia Soirée</h3>
  <span>Look 01</span>
</div>

    <div class="kaylia-piece">
      <img src="images/anna-dragonfly1.png" alt="Anna Dragonfly">
      <h3>Anna Dragonfly</h3>
      <span>Look 03</span>
    </div>

    <div class="kaylia-piece">
      <img src="images/Rue-Faubourg .png" alt="Rue Faubourg">
      <h3>Rue Faubourg</h3>
      <span>Look 04</span>
    </div>

    <div class="kaylia-piece">
      <img src="images/monaco.png" alt="Monaco">
      <h3>Monaco</h3>
      <span>Look 05</span>
    </div>
  </section>

</main>
<script>
document.querySelectorAll('.piece-slider').forEach(slider => {
  const images = slider.querySelectorAll('img');
  const prev = slider.querySelector('.prev');
  const next = slider.querySelector('.next');
  let current = 0;

  function showImage(index) {
    images[current].classList.remove('active');
    current = (index + images.length) % images.length;
    images[current].classList.add('active');
  }

  prev.addEventListener('click', () => showImage(current - 1));
  next.addEventListener('click', () => showImage(current + 1));
});
</script>
